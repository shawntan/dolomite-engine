#   load_path:  /proj/checkpoints/shawntan/RNN/checkpoints/sm-1.6b.yml

# load_args:
#   load_path:  /proj/checkpoints/shawntan/SUT/sut-hybrid-1.4b-swa-halt

logging_args:
  log_interval: 10
  # torch_profiler_trace_path: tmp
  experiments_tracker_name: wandb
  wandb_args:
    project: granite_rnn
    name: mokv-1.6b





training_parameters:
  num_training_steps: 2500000
  eval_interval: 100000000000
  micro_batch_size: 2
  gradient_accumulation_steps: 4
  eval_during_training: false




optimizer_args:
  params_group_method: mup
  class_name: TorchAdamW
  class_args:
    lr: 0.01
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-10


lr_scheduler_args:
  lr_decay_style: power
  num_warmup_steps: 5000
  num_constant_steps: 0
  # num_decay_steps: 2495000
  num_decay_steps: 2500000
  extra_lr_scheduler_args:
    # 4 * global_batch_size
    a: 4096
    # constant
    b: -0.51
    # global_batch_size in number of tokens
    c: 4194304


mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: false
  stage: 0
